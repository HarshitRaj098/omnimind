name: AI Core checks

on:
  push:
    branches:
      - ai-core/rea-powered-agent
    paths:
      - "ai-core/**"
      - ".github/workflows/ai-core.yml"
  pull_request:
    paths:
      - "ai-core/**"
      - ".github/workflows/ai-core.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
